name: CI — Continuous Integration Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Lint, Type Check, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Cache Next.js Build Artifacts
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install Dependencies (Deterministic Lockfile)
        run: npm ci

      - name: Code Style & Lint (ESLint)
        run: npm run lint -- --max-warnings=262

      - name: TypeScript Type Check
        run: npm run type-check

      - name: Design Palette Audit (60:30:10 Rule)
        run: npm run audit:design

      - name: Automated Unit & Regression Tests
        run: npm test

      - name: Next.js Production Build Verification
        run: npm run build
